<body>
    <h1>Form</h1>

    <h3>Student reg. form</h3>

    

    <form>
        <div style="display: flex;">
            <div style="width: 350px;">
                <fieldset>
                    <legend>Personal Details</legend>
                    <label for="fname">First Name:</label>
                    <input type="text" name="fname" id="fname" minlength="5" maxlength="20" pattern="[0-9]{10}"
                        placeholder="Enter your name here" required />
                    <br><br>

                    <label for="email">E-mail:</label>
                    <input type="email" name="email" id="email"><br><br>


                    <label for="dob">DOB:</label>
                    <input type="datetime-local" name="dob" id="dob"><br><br>
                </fieldset>

                <input type="checkbox" name="bike" id="bike">
                <label for="bike">I have bike</label><br><br>

                <input type="image" src="img/spider.jpeg" alt="image here" name="sphoto" id="sphoto"><br><br>

                <label for="volume">Volume:</label>
                <input type="range" min="10" max="30" step="3" name="volume" id="volume"><br><br>

                <textarea style="width: 400px;height:200px">

                    </textarea>
            </div>

            <div style="width: 50%;">
                <label for="mycolor">Fav. color:</label>
                <input type="color" name="favcolor" id="mycolor"><br><br>

                <label for="password">pasword:</label>
                <input type="password" name="password" id="password"><br><br>

                <label for="gender">Gender:</label>

                <input type="radio" name="gender" id="male"><label for="male">Male</label>
                <input type="radio" name="gender" id="female"><label for="female">Female</label>
                <input type="radio" name="gender" id="others"><label for="others">Others</label>
                <br><br>
                <label for="sphoto">Upload photo:</label>
                <input type="file" name="sphoto" accept="image/*,audio/*,video/*" id="sphoto"><br><br>
                <button>Save button</button>
                <input type="submit" name="submit" id="submit"><br><br>
                <input type="reset" name="reset" id="reset"><br><br>

                <select name="lang" multiple>
                    <optgroup label="Lang gr 1">
                        <option value="tamil">Tamil</option>
                        <option value="eng">English</option>
                        <option value="">Maths</option>
                    </optgroup>
                    <optgroup label="Lang gr 2">
                        <option value="Telugu">Telugu</option>
                        <option value="Malayalam">Malayalam</option>
                    </optgroup>
                </select>

                <input list="city">
                <datalist id="city">
                    <option value="Erode">Erode</option>
                    <option value="Thirupur">Thirupur</option>

                </datalist>
            </div>

        </div>
    </form>

    <hr size="10" noshade width="200">

    <form action="submit">
        <label for="url">Type the website address:</label>
        <input type="url" name="url" id="url"><br><br>
        <input type="submit" name="submit" id="submit"><br><br>
    </form>
