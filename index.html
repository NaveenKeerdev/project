<button id="NK" onclick="update()">Naveen</button>
<button id="AK" onclick="upd()">Arun</button>
<button id="RK" onclick="up()">Ram</button>
<script>
    //select the button tag
    var NK = document.getElementById("NK")
    var AK = document.getElementById("AK")
    var RK = document.getElementById("RK")

    function update() {
        NK.style.backgroundColor = "green"


    }

    function upd() {
        AK.style.backgroundColor = "red"
    }

    function up() {
        RK.style.backgroundColor = "blue"
    }
</script>
